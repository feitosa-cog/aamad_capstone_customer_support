[project]
name = "agentic_customer_support"
version = "0.1.0"
description = "agentic_customer_support using crewAI"
authors = [{ name = "Carlos Feitosa", email = "carlos.feitosa@cognizant.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.2",
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=1.10.0",
    "SQLAlchemy>=2.0"
]

[project.scripts]
agentic_customer_support = "agentic_customer_support.main:run"
run_crew = "agentic_customer_support.main:run"
train = "agentic_customer_support.main:train"
replay = "agentic_customer_support.main:replay"
test = "agentic_customer_support.main:test"
run_with_trigger = "agentic_customer_support.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = [
    "onnxruntime==1.17.1",
]
